# ============================================================================
# ScholarNerve — Nginx reverse proxy for the VPS
#
# Handles every school subdomain (wildcard) + apex, serves the built frontend
# (Vite `dist/`) as a SPA, and proxies /api and /uploads to the Node backend.
#
# Why this matters for PWA install logos:
#   The web app manifest points icons at  /api/pwa/logo?...  and the manifest
#   itself at  /api/pwa/manifest?...  . Android's WebAPK minting servers and iOS
#   fetch these URLs DIRECTLY (no service worker). This config makes /api a real,
#   server-side resource on EVERY school host, so each school installs with its
#   own logo on Android, iOS, and desktop.
#
# Adjust before use:
#   - server_name  -> your domain(s)
#   - root         -> absolute path to the built frontend (the Vite `dist` dir)
#   - ssl_certificate / ssl_certificate_key -> your wildcard cert paths
#   - proxy_pass port (3001) if your backend listens elsewhere
# ============================================================================

# Map the Upgrade header so Socket.IO / WebSockets work through the proxy.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# ----- HTTP -> HTTPS redirect (apex + all school subdomains) ----------------
server {
  listen 80;
  listen [::]:80;
  server_name scholarnerve.com www.scholarnerve.com *.scholarnerve.com;

  # Allow ACME http-01 challenges if you renew certs over HTTP.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# ----- HTTPS: apex + every school subdomain ---------------------------------
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;

  # Wildcard covers school1.scholarnerve.com, school2.scholarnerve.com, etc.
  server_name scholarnerve.com www.scholarnerve.com *.scholarnerve.com;

  # ---- TLS (use a WILDCARD cert so every *.scholarnerve.com is covered) ----
  ssl_certificate     /etc/letsencrypt/live/scholarnerve.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/scholarnerve.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  # Built frontend (Vite output). Run `npm run build` and point this at dist/.
  root /var/www/scholarnerve/dist;
  index index.html;
  autoindex off;

  # Allow large logo / file uploads to reach the backend.
  client_max_body_size 50m;

  # Common proxy headers reused below. The backend resolves the tenant from the
  # host, so forwarding the ORIGINAL Host + X-Forwarded-Host is essential.
  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host  $host;

  # ---- API (includes /api/pwa/manifest and /api/pwa/logo) ----
  location /api/ {
    proxy_pass http://127.0.0.1:3001;
    # WebSocket upgrade (Socket.IO falls back to /socket.io but may live here too)
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 600s;
  }

  # ---- Socket.IO real-time endpoint ----
  location /socket.io/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 600s;
  }

  # ---- Uploaded files (tenant logos stored on disk, served by backend) ----
  location /uploads/ {
    proxy_pass http://127.0.0.1:3001;
  }

  # ---- Service worker: never cache the SW script itself ----
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  # ---- Hashed build assets: safe to cache aggressively ----
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Partner emblem PNGs live under /partners/*.png — serve files directly.
  location ~ ^/partners/.+\.(png|jpe?g|webp|svg|ico)$ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public";
  }

  # Partner Network landing page — dist/partners/ is also a folder, so try_files
  # on /partners alone returns 403 Forbidden instead of falling back to index.html.
  location = /partners {
    try_files /index.html =404;
  }
  location = /partners/ {
    return 301 /partners;
  }

  # ---- SPA fallback: every other route serves index.html ----
  # index.html must NOT be cached so new deploys are picked up immediately.
  location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri $uri/ /index.html;
  }
}
