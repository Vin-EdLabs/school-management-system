  <!-- Dynamic PWA manifest + icons (desktop + mobile) before app bundle loads -->
  <script>
    (function () {
      var host = location.hostname;
      var path = location.pathname || '/';
      var params = new URLSearchParams();
      params.set('host', host);
      var schoolMatch = path.match(/^\/school\/(\d+)/);
      var portalMatch = path.match(/^\/portal\/(\d+)/);
      var schMatch = path.match(/^\/sch\/([^/]+)/);
      if (schoolMatch) params.set('tenantId', schoolMatch[1]);
      if (portalMatch) params.set('tenantId', portalMatch[1]);
      if (schMatch) params.set('slug', schMatch[1]);

      var hostParts = host.toLowerCase().replace(/^www\./, '').split('.');
      var reserved = ['www', 'api', 'app', 'admin', 'dev', 'staging', 'scholarnerve', 'portal', 'school', 'partners'];
      var slugFromHost = null;
      var isPartnersHost = hostParts[0] === 'partners';
      var isPartnersPath = path === '/partners' || path.indexOf('/partners/') === 0;

      var kind = path.indexOf('/tn-7x4k2') === 0 ? 'super-admin'
        : path.indexOf('/portal') === 0 ? 'parent'
        : (isPartnersHost || isPartnersPath) ? 'partners'
        : 'school';
      params.set('kind', kind);

      if (host.indexOf('.localhost') > -1 && hostParts.length >= 2 && reserved.indexOf(hostParts[0]) === -1) {
        slugFromHost = hostParts[0];
      } else if (host.indexOf('.lvh.me') > -1 && hostParts.length >= 3 && reserved.indexOf(hostParts[0]) === -1) {
        slugFromHost = hostParts[0];
      } else if (host.indexOf('scholarnerve.com') > -1 && host !== 'scholarnerve.com' && host !== 'www.scholarnerve.com' && hostParts.length >= 3 && reserved.indexOf(hostParts[0]) === -1) {
        slugFromHost = hostParts[0];
      }
      if (slugFromHost) params.set('slug', slugFromHost);

      if (isPartnersHost || isPartnersPath) {
        params.delete('slug');
        params.delete('tenantId');
      }

      var manifest = document.createElement('link');
      manifest.rel = 'manifest';
      // Partner PWA: static manifest + icons (works in dev without backend)
      manifest.href = (isPartnersHost || isPartnersPath)
        ? '/partners/manifest.webmanifest'
        : '/api/pwa/manifest?' + params.toString();
      document.head.appendChild(manifest);

      var isPartnerBranding = isPartnersHost || isPartnersPath;
      var isTenantHost = !isPartnerBranding && (!!slugFromHost || schoolMatch || portalMatch || schMatch || path.indexOf('/portal') === 0);

      if (isPartnerBranding) {
        var pIcon = location.origin + '/partners/scholarnerve-partner-emblem.png';
        var pApple = document.createElement('link');
        pApple.rel = 'apple-touch-icon';
        pApple.sizes = '180x180';
        pApple.href = pIcon;
        document.head.appendChild(pApple);
        var pShortcut = document.createElement('link');
        pShortcut.rel = 'shortcut icon';
        pShortcut.href = pIcon;
        document.head.appendChild(pShortcut);
        var pFavicon = document.createElement('link');
        pFavicon.rel = 'icon';
        pFavicon.type = 'image/png';
        pFavicon.href = pIcon;
        document.head.appendChild(pFavicon);
        var pIcon32 = document.createElement('link');
        pIcon32.rel = 'icon';
        pIcon32.type = 'image/png';
        pIcon32.sizes = '32x32';
        pIcon32.href = pIcon;
        document.head.appendChild(pIcon32);
        var pIcon16 = document.createElement('link');
        pIcon16.rel = 'icon';
        pIcon16.type = 'image/png';
        pIcon16.sizes = '16x16';
        pIcon16.href = pIcon;
        document.head.appendChild(pIcon16);
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        if (themeMeta) themeMeta.setAttribute('content', '#146c43');
      } else if (isTenantHost) {
        var logoUrl = location.origin + '/api/pwa/logo?' + params.toString() + '&size=180';
        function upsertIcon(rel, sizes, type) {
          var selector = 'link[rel="' + rel + '"]' + (sizes ? '[sizes="' + sizes + '"]' : '');
          var el = document.querySelector(selector);
          if (!el) {
            el = document.createElement('link');
            el.rel = rel;
            if (sizes) el.setAttribute('sizes', sizes);
            if (type) el.type = type;
            document.head.appendChild(el);
          }
          el.href = logoUrl;
        }
        upsertIcon('apple-touch-icon', '180x180');
        upsertIcon('shortcut icon');
        upsertIcon('icon', '32x32', 'image/png');
        upsertIcon('icon', '16x16', 'image/png');
      } else {
        var apple = document.createElement('link');
        apple.rel = 'apple-touch-icon';
        apple.sizes = '180x180';
        apple.href = '/apple-touch-icon.png';
        document.head.appendChild(apple);
        var shortcut = document.createElement('link');
        shortcut.rel = 'shortcut icon';
        shortcut.href = '/favicon.ico';
        document.head.appendChild(shortcut);
        var icon32 = document.createElement('link');
        icon32.rel = 'icon';
        icon32.type = 'image/png';
        icon32.sizes = '32x32';
        icon32.href = '/favicon-32x32.png';
        document.head.appendChild(icon32);
        var icon16 = document.createElement('link');
        icon16.rel = 'icon';
        icon16.type = 'image/png';
        icon16.sizes = '16x16';
        icon16.href = '/favicon-16x16.png';
        document.head.appendChild(icon16);
      }

      var isDevHost = host === 'localhost' || host === '127.0.0.1' ||
        host.endsWith('.localhost') || host.endsWith('.lvh.me');

      if ('serviceWorker' in navigator) {
        if (isDevHost) {
          // Dev: tear down stale SW/caches (they break Vite HMR). Reload at most once
          // per tab — otherwise *.localhost can loop forever if a controller lingers.
          var hadController = !!navigator.serviceWorker.controller;
          var alreadyPurged = false;
          try {
            alreadyPurged = sessionStorage.getItem('sn-dev-sw-purge') === '1';
          } catch (e) { /* ignore */ }

          navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) { return r.unregister(); }));
          }).then(function () {
            if (window.caches && caches.keys) {
              return caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              });
            }
          }).then(function () {
            if (!hadController || alreadyPurged) return;
            try {
              sessionStorage.setItem('sn-dev-sw-purge', '1');
            } catch (e) { /* ignore */ }
            location.reload();
          }).catch(function () {});
        } else {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        }
      }
    })();
  </script>

  <style id="sn-splash-style">
    #sn-splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: linear-gradient(145deg, #ffffff 0%, #e8f5f0 40%, #0f766e 100%);
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }
    #sn-splash.sn-splash-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    #sn-splash-logo {
      width: 96px;
      height: 96px;
      border-radius: 16px;
      object-fit: contain;
      background: rgba(255, 255, 255, 0.15);
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.15));
    }
    #sn-splash-name {
      color: #0f766e;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.01em;
      text-align: center;
      max-width: 240px;
      opacity: 0.9;
    }
    #sn-splash-spinner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 16px;
    }
    #sn-splash-spinner span {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #0f766e;
      display: inline-block;
      animation: sn-bubble 1.2s ease-in-out infinite;
    }
    #sn-splash-spinner span:nth-child(1) { animation-delay: 0s; }
    #sn-splash-spinner span:nth-child(2) { animation-delay: 0.2s; }
    #sn-splash-spinner span:nth-child(3) { animation-delay: 0.4s; }
    #sn-splash-spinner span:nth-child(4) { animation-delay: 0.6s; }

    #sn-splash-status {
      color: #0f766e;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      font-weight: 500;
      opacity: 0.75;
      min-height: 18px;
      text-align: center;
      transition: opacity 0.3s ease;
    }
    #sn-splash-status.sn-status-fading {
      opacity: 0;
    }

    #sn-splash-recovery {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      max-width: 280px;
      text-align: center;
      margin-top: 8px;
    }
    #sn-splash-recovery.is-visible {
      display: flex;
    }
    #sn-splash-recovery p {
      color: #0f766e;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      opacity: 0.85;
      margin: 0;
    }
    #sn-splash-hard-refresh {
      appearance: none;
      border: none;
      border-radius: 10px;
      background: #0f766e;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 18px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(15, 118, 110, 0.25);
    }
    #sn-splash-hard-refresh:hover {
      background: #0d6b64;
    }

    @keyframes sn-bubble {
      0%, 80%, 100% {
        transform: scale(0.6);
        opacity: 0.4;
      }
      40% {
        transform: scale(1.2);
        opacity: 1;
      }
    }
  </style>

  <script>
    (function () {
      var host = location.hostname.toLowerCase().replace(/^www\./, '');
      var path = (location.pathname || '/').replace(/\/$/, '') || '/';
      var isMainLanding =
        path === '/' &&
        (host === 'scholarnerve.com' ||
          host === 'localhost' ||
          host === '127.0.0.1' ||
          host.endsWith('.lvh.me'));
      if (!isMainLanding) return;
      var splash = document.getElementById('sn-splash');
      if (splash) {
        splash.classList.add('sn-splash-hidden');
        window.dispatchEvent(new Event('sn-splash-hidden'));
      }
    })();
  </script>
  <script>
    (function () {
      var host = location.hostname.toLowerCase();
      var isApex =
        host === 'scholarnerve.com' ||
        host === 'www.scholarnerve.com' ||
        host === 'localhost' ||
        host === '127.0.0.1' ||
        host.indexOf('partners.') === 0;
      var statusEl = document.getElementById('sn-splash-status');
      if (statusEl && isApex) {
        statusEl.textContent = 'Loading ScholarNerve…';
      }

      var recoveryEl = document.getElementById('sn-splash-recovery');
      var refreshBtn = document.getElementById('sn-splash-hard-refresh');
      var splashEl = document.getElementById('sn-splash');
      var recoveryTimer = window.setTimeout(function () {
        if (splashEl && !splashEl.classList.contains('sn-splash-hidden') && recoveryEl) {
          recoveryEl.classList.add('is-visible');
        }
      }, 4000);

      if (refreshBtn) {
        refreshBtn.addEventListener('click', function () {
          refreshBtn.disabled = true;
          refreshBtn.textContent = 'Refreshing…';
          Promise.resolve()
            .then(function () {
              if (window.caches && caches.keys) {
                return caches.keys().then(function (keys) {
                  return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                });
              }
            })
            .then(function () {
              if ('serviceWorker' in navigator) {
                return navigator.serviceWorker.getRegistrations().then(function (regs) {
                  return Promise.all(regs.map(function (r) { return r.unregister(); }));
                });
              }
            })
            .finally(function () {
              location.reload();
            });
        });
      }

      window.addEventListener('sn-splash-hidden', function () {
        clearTimeout(recoveryTimer);
      });
    })();
  </script>
  <script>
    (function () {
      var host = location.hostname.toLowerCase();
      var isApex =
        host === 'scholarnerve.com' ||
        host === 'www.scholarnerve.com' ||
        host === 'localhost' ||
        host === '127.0.0.1' ||
        host.indexOf('partners.') === 0;
      var messages = isApex ? [
        'Loading ScholarNerve…',
        'Getting things ready…',
        'Almost there…',
        'Just a moment…',
        'Nearly done…'
      ] : [
        'Loading your school…',
        'Getting things ready…',
        'Almost there…',
        'Setting up your workspace…',
        'Just a moment…',
        'Nearly done…'
      ];
      var idx = 0;
      var el = document.getElementById('sn-splash-status');
      var splash = document.getElementById('sn-splash');
      if (!el || !splash) return;
      var timer = setInterval(function () {
        // Stop cycling once the splash has been hidden by the app
        if (splash.classList.contains('sn-splash-hidden')) {
          clearInterval(timer);
          return;
        }
        idx = (idx + 1) % messages.length;
        el.classList.add('sn-status-fading');
        setTimeout(function () {
          el.textContent = messages[idx];
          el.classList.remove('sn-status-fading');
        }, 300);
      }, 2200);
    })();
  </script>
  <script>
    (function () {
      try {
        var host = location.hostname;
        var path = location.pathname || '/';
        var hostParts = host.toLowerCase().replace(/^www\./, '').split('.');
        var reserved = ['www', 'api', 'app', 'admin', 'dev', 'staging', 'scholarnerve', 'portal', 'school', 'partners'];
        var slug = null;

        if (host.indexOf('.localhost') > -1 && hostParts.length >= 2 && reserved.indexOf(hostParts[0]) === -1) {
          slug = hostParts[0];
        } else if (host.indexOf('.lvh.me') > -1 && hostParts.length >= 3 && reserved.indexOf(hostParts[0]) === -1) {
          slug = hostParts[0];
        } else if (
          host.indexOf('scholarnerve.com') > -1 &&
          host !== 'scholarnerve.com' &&
          host !== 'www.scholarnerve.com' &&
          hostParts.length >= 3 &&
          reserved.indexOf(hostParts[0]) === -1
        ) {
          slug = hostParts[0];
        }

        var schMatch = path.match(/^\/sch\/([^/]+)/);
        if (schMatch) slug = schMatch[1];

        if (!slug) {
          var schoolMatch = path.match(/^\/school\/(\d+)/);
          var portalMatch = path.match(/^\/portal\/(\d+)/);
          if (schoolMatch) slug = 'id-' + schoolMatch[1];
          else if (portalMatch) slug = 'id-' + portalMatch[1];
        }

        if (!slug) {
          slug = localStorage.getItem('sn_last_tenant_slug');
        }

        var splash = document.getElementById('sn-splash');
        if (!splash) return;

        if (slug) {
          var branding = JSON.parse(localStorage.getItem('sn_splash_' + slug) || 'null');
          if (branding) {
            var nameEl = document.getElementById('sn-splash-name');
            if (branding.schoolName && nameEl) nameEl.textContent = branding.schoolName;
            var logoDataUrl = localStorage.getItem('sn_splash_logo_' + slug);
            var logoEl = document.getElementById('sn-splash-logo');
            var logoSrc = logoDataUrl || branding.logoUrl;
            if (logoSrc && logoEl) {
              logoEl.src = logoSrc;
              logoEl.style.display = 'block';
            }
          }
        }
      } catch (e) {
        /* splash is best-effort */
      }
    })();
  </script>
